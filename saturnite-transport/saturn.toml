[package]
name = "hermes-transport"
version = "0.1.0"
edition = "2026"

[dependencies]
saturnite-stdlib = "0.1"
tokio = { kind = "rust", version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
tokio-tungstenite = { kind = "rust", version = "0.21" }
tungstenite = { kind = "rust", version = "0.21" }
serde = { kind = "rust", version = "1.0", features = ["derive"] }
serde_json = { kind = "rust", version = "1.0" }
uuid = { kind = "rust", version = "1.8", features = ["v4", "serde"] }
tracing = { kind = "rust", version = "0.1" }
tracing-subscriber = { kind = "rust", version = "0.3" }
anyhow = { kind = "rust", version = "1.0" }

[build]
source = "src"
entry = "main"